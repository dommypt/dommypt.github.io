# Everything shown on the site. See EDITING.md for a step-by-step guide.
#
# The file has two sections:
#   site:      your name, bio and header links
#   projects:  the project cards
# Pictures and photo-gallery folders go in the "images" folder next to this file.

# ---------------------------------------------------------------------------
# Site-wide settings. Edit the text between the quotes.
# ---------------------------------------------------------------------------
site:
  # Your name, shown as the big heading at the top of the page.
  name: "Dominika Ptasińska"

  # One or two sentences about you, shown under your name.
  bio: "Jestem specjalistką ds. komunikacji i promocji, która łączy marketing treści z myśleniem o doświadczeniu użytkownika. Od kilku lat współtworzę i koordynuję promocję jednego z większych konwentów fantastyki w regionie: prowadzę social media, piszę teksty, projektuję grafiki i dbam o spójną identyfikację wizualną. Wcześniej pracowałam w obsłudze klienta i wsparciu technicznym w branży technologicznej, dlatego dobrze wiem, czego naprawdę potrzebują odbiorcy i jak mówić do nich zrozumiale. Najlepiej czuję się tam, gdzie treść, grafika i dobra historia pracują razem."
  # Optional links shown in the header (Instagram, LinkedIn, email, ...).
  # Remove the "#" at the start of the lines below to use them.
  links:
   - label: Instagram
     url: https://www.instagram.com/do.mmy/
   - label: LinkedIn
     url: https://www.linkedin.com/in/dommypt/
   - label: Dysk
     url: https://drive.google.com/drive/folders/1S0UrtAl9wqTQ9viTzkESsAnP0g9mw9IM?usp=drive_link

# ---------------------------------------------------------------------------
# Projects
# ---------------------------------------------------------------------------
#
# Copy one of these templates for each new project (keep the indentation!).
# "branch", "date", "description" and "tags" are optional in all of them.
# "branch" puts the project under a tab at the top of the page (e.g. Graphic Design).
#
# Canva design. "url" is the "Smart embed link" (Share → Embed → Embed):
#
# - title: My Project Name
#   url: https://www.canva.com/design/XXXXXXXX/YYYYYYYY/view?embed
#   date: 2026-01-31
#   description: One short sentence about the project.
#   tags: [poster, branding]
#
# Instagram post. "url" is the post's link (⋯ → Copy link):
#
# - title: My Instagram Post
#   url: https://www.instagram.com/p/XXXXXXXXXXX/
#   date: 2026-01-31
#
# TikTok video. "url" is the full link from the browser's address bar
# (not a short vm.tiktok.com link):
#
# - title: My TikTok
#   url: https://www.tiktok.com/@username/video/1234567890123456789
#   date: 2026-01-31
#
# Picture. Upload the image into the images folder first (subfolders are fine):
#
# - title: My Picture
#   image: my-picture.png
#   date: 2026-01-31
#
# Photo gallery. Upload a whole folder of photos into the images folder and use
# the folder name. All photos in it are shown in one card, in file-name order:
#
# - title: My Gallery
#   image: my-photo-folder
#   date: 2026-01-31
#
# The site shows the newest projects first; projects without a date go last,
# in the order they appear in this file.

